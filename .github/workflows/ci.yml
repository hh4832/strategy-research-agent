name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# M4: every run step uses bash with -e -o pipefail, so `cmd | tee` can never hide a failing cmd.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # N2: the notebook's pinned integration commit is checked against HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Validate example specs
        run: python -m strategy_agent.spec.validate specs/examples/*.json

  core-compat:
    # M1: real market-research-core at the pinned commit (read-only dependency; never modified here).
    runs-on: ubuntu-latest
    env:
      MRC_SHA: 699e3ad59951bbebb769bb69170be8d9a1a96c01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[test]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}"
      - run: pytest -q tests/test_m1_core_compat.py tests/test_m1_adapter.py
      - name: B01-B12 + G16 + G17 + G14b on the real Core (all PASS, exact Decimal) and BENCHMARK_PASS derived
        run: |
          python -m benchmark.harness.mrc_crosscheck --out "$RUNNER_TEMP/mrc"
          python - <<'PY'
          import json, os, pathlib
          rec = json.loads(next(pathlib.Path(os.environ["RUNNER_TEMP"], "mrc").glob("mrc_*/crosscheck.json")).read_text())
          print(rec["verdict"], rec["counts"], rec["probes"]["G16_acceptance"]["status"],
                {k: v["status"] for k, v in rec["probes"]["oracle_probes"].items()})
          assert rec["engine"]["kind"] == "REAL_CORE" and rec["engine"]["git_sha"] == os.environ["MRC_SHA"]
          assert rec["verdict"] == "PASS" and rec["counts"]["PASS"] == 12
          assert rec["probes"]["G16_acceptance"]["status"] == "PASS"
          assert all(rec["probes"]["oracle_probes"][g]["status"] == "PASS" for g in ("G17", "G14b"))
          from strategy_agent.adapters import mrc_adapter as A
          st = A.engine_benchmark_status(os.environ["MRC_SHA"], pathlib.Path(os.environ["RUNNER_TEMP"], "mrc"))
          print(st)
          assert st["status"] == "BENCHMARK_PASS"
          PY

  research-synthetic:
    # M3-B1: synthetic research run on the real Core, isolated governance, reproducibility + archive evidence.
    runs-on: ubuntu-latest
    env:
      MRC_SHA: 699e3ad59951bbebb769bb69170be8d9a1a96c01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}"
      - run: pytest -q tests/test_m3b_unit.py tests/test_m3b_integration.py tests/test_m3b2_archive_resume.py
      - name: Real-market gate stays closed (exit 3) until M3-A is GO
        run: |
          set +e
          python -m strategy_agent.research readiness --market IBKR_TSM; test $? -eq 3 || exit 1
          python -m strategy_agent.research real --market IBKR_TSM; test $? -eq 3 || exit 1
      - name: Synthetic SMA 5/20 run x2 (must COMPLETE, archive and reproduce)
        run: |
          python -m strategy_agent.research synthetic --run-root "$RUNNER_TEMP/m3b_env" \
            --archive-root "$RUNNER_TEMP/m3b_archive" --repeat 2 --batch-id ci
          git diff --exit-code -- registry governance   # formal registry / holdout untouched
      - name: Research configuration run (2 windows x 4 cost scenarios) + resume
        run: |
          python -m strategy_agent.research run --config configs/research/sma_5_20_tsm_synthetic_local_v1.json \
            --run-root "$RUNNER_TEMP/m3b_env" --archive-root "$RUNNER_TEMP/m3b_archive" --batch-id ci_config \
            --summary-out "$RUNNER_TEMP/m3b_archive/ci_config_summary.json"
          python -m strategy_agent.research run --config configs/research/sma_5_20_tsm_synthetic_local_v1.json \
            --run-root "$RUNNER_TEMP/m3b_env" --archive-root "$RUNNER_TEMP/m3b_archive" --batch-id ci_config --resume
          git diff --exit-code -- registry governance
      - name: M3-C Core M3-A.4 integration (conservative temporal + componentized TEST_ONLY costs, 14 items + tamper)
        run: pytest -q tests/test_m3c_core_integration.py
      - name: M3-C bounded E2E on Core 699e3ad (native-1m fixture, CONSERVATIVE_LABEL_AGNOSTIC, BASE/LOW/STRESS) + resume
        run: |
          python -m strategy_agent.research run --config configs/research/sma_5_20_tsm_conservative_synthetic_local_v1.json \
            --run-root "$RUNNER_TEMP/m3c_env" --archive-root "$RUNNER_TEMP/m3b_archive" --batch-id ci_m3c \
            --summary-out "$RUNNER_TEMP/m3b_archive/ci_m3c_summary.json"
          python - <<'PY'
          import json, os
          s = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "m3b_archive", "ci_m3c_summary.json")))
          assert s["ok"] and len(s["runs"]) == 6
          assert all(o["status"] == "COMPLETED" and o["archive_status"] == "ARCHIVED" for o in s["runs"]), s["runs"]
          for r in s["cost_sensitivity"]["rows"]:
              print(r["role"], r["scenario_id"], r["trade_count"], r["net_pnl"], r["metrics_sha256"])
          PY
          python -m strategy_agent.research run --config configs/research/sma_5_20_tsm_conservative_synthetic_local_v1.json \
            --run-root "$RUNNER_TEMP/m3c_env" --archive-root "$RUNNER_TEMP/m3b_archive" --batch-id ci_m3c --resume
          git diff --exit-code -- registry governance
      - uses: actions/upload-artifact@v4
        with:
          name: m3b-synthetic-archive
          path: ${{ runner.temp }}/m3b_archive
          retention-days: 30

  phase4a-core:
    # Phase 4-A research-only integration on Core e31c57b (TSM native adapter, SCOPED_GO, Core CI 42142535761).
    # Phase 3 jobs above stay on 699e3ad. BENCHMARK_PASS is re-derived here for the new SHA before anything else.
    runs-on: ubuntu-latest
    env:
      MRC_SHA: e31c57b6c9dd599d808516ce6664628bdc79319e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}"
      - name: B01-B12 + G16 + G17 + G14b on Core e31c57b and BENCHMARK_PASS derived
        run: |
          python -m benchmark.harness.mrc_crosscheck --out "$RUNNER_TEMP/mrc"
          python - <<'PY'
          import json, os, pathlib
          rec = json.loads(next(pathlib.Path(os.environ["RUNNER_TEMP"], "mrc").glob("mrc_*/crosscheck.json")).read_text())
          assert rec["engine"]["kind"] == "REAL_CORE" and rec["engine"]["git_sha"] == os.environ["MRC_SHA"]
          assert rec["verdict"] == "PASS" and rec["counts"]["PASS"] == 12
          from strategy_agent.adapters import mrc_adapter as A
          st = A.engine_benchmark_status(os.environ["MRC_SHA"], pathlib.Path(os.environ["RUNNER_TEMP"], "mrc"))
          print(st)
          assert st["status"] == "BENCHMARK_PASS"
          PY
      - run: pytest -q tests/test_phase4a_research_only.py tests/test_phase4a_core_integration.py tests/test_m1_core_compat.py tests/test_m1_adapter.py
      - name: Repository preflight (governance only, no data, no slot)
        run: |
          python - <<'PY'
          from pathlib import Path
          from strategy_agent.research_only.runner import ResearchOnlyRunner
          pf = ResearchOnlyRunner().preflight(Path("configs/research_only/tsm_sma_5_20_smoke_2024_06_v1_1.json"))
          print(pf.status, pf.blockers)
          assert {c for c, _ in pf.blockers} <= {"RA02", "RA11"}, pf.blockers   # expiry / spent slot only
          PY
          git diff --exit-code -- registry governance

  development-snapshot-preflight:
    # Data preparation ONLY. No strategy, no real data, no authorization consumption.
    runs-on: ubuntu-latest
    env:
      MRC_SHA: b16179a7cc077c36046574769a32c367fa476cae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}"
      - name: Require actual v1.1 producer import and exact Core pin (no silent zero-test pass)
        run: |
          python - <<'PYCODE'
          import os
          from strategy_agent.adapters.mrc_phase4a import core_development
          development, native = core_development()
          assert native.core_code_identity()["core_git_sha"] == os.environ["MRC_SHA"]
          assert development.DevelopmentSnapshotPin
          PYCODE
      - run: pytest -q tests/test_development_snapshot_preflight.py
      - run: git diff --exit-code -- registry governance

  phase4a-dev-smoke:
    # Real-smoke execution path on the development-snapshot reader Core b16179a: BENCHMARK_PASS re-derived for this
    # SHA, then synthetic (TEST_ONLY) end-to-end smoke incl. receipt renewal, single consumption and archive contract.
    runs-on: ubuntu-latest
    env:
      MRC_SHA: b16179a7cc077c36046574769a32c367fa476cae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}"
      - name: B01-B12 + G16 + G17 + G14b on Core b16179a and BENCHMARK_PASS derived
        run: |
          python -m benchmark.harness.mrc_crosscheck --out "$RUNNER_TEMP/mrc"
          python - <<'PY'
          import json, os, pathlib
          rec = json.loads(next(pathlib.Path(os.environ["RUNNER_TEMP"], "mrc").glob("mrc_*/crosscheck.json")).read_text())
          assert rec["engine"]["kind"] == "REAL_CORE" and rec["engine"]["git_sha"] == os.environ["MRC_SHA"]
          assert rec["verdict"] == "PASS" and rec["counts"]["PASS"] == 12
          from strategy_agent.adapters import mrc_adapter as A
          st = A.engine_benchmark_status(os.environ["MRC_SHA"], pathlib.Path(os.environ["RUNNER_TEMP"], "mrc"))
          print(st)
          assert st["status"] == "BENCHMARK_PASS"
          PY
      - run: pytest -q tests/test_phase4a_development_smoke.py tests/test_development_snapshot_preflight.py tests/test_phase4a_development_auth_contract.py tests/test_phase4a_research_only.py tests/test_phase4a_core_integration.py tests/test_m1_adapter.py tests/test_m1_core_compat.py
      - run: git diff --exit-code -- registry governance configs

  phase5b2-controlled:
    # Phase 5-B2: controlled execution + atomic budget. Layer A (SYNTHETIC_FIXTURE, no Core) and Layer B (the existing
    # ResearchOnlyRunner on a SYNTHETIC development snapshot, Core b16179a). Isolated books only; real runner DISABLED.
    # Security remediation of PR #13 (Codex P0-1/2/3): regression suite + re-derived reproducer, Python 3.11 and 3.12.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MRC_SHA: b16179a7cc077c36046574769a32c367fa476cae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}"
      - name: B2 suites (junit; the real exit code fails the step)
        run: |
          rc=0
          pytest -q -p no:cacheprovider tests/test_phase5b2_controlled.py tests/test_phase5b2_runner_core.py \
            tests/test_phase5b2_security_remediation.py tests/test_phase5b2_acceptance.py \
            --junitxml "$RUNNER_TEMP/b2.xml" || rc=$?
          echo "$rc" > "$RUNNER_TEMP/b2_rc"
          exit "$rc"
      - name: B2-01..B2-10 acceptance (fresh process; expected SCOPED_GO, B2-10 BLOCKED without Drive)
        run: |
          python -m strategy_agent.execution.acceptance --out-dir "$RUNNER_TEMP/executions/ci_${GITHUB_SHA::7}" \
            --junit "$RUNNER_TEMP/b2.xml" --tests-rc "$(cat "$RUNNER_TEMP/b2_rc")" | tee "$RUNNER_TEMP/b2.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "b2.json")))
          assert all(r["gates"][f"B2-0{i}"] == "PASS" for i in range(1, 10)), r["gates"]
          assert r["layer_b"] == "PASS" and r["verdict"]["verdict"] == "SCOPED_GO", r
          # the three P0 findings: fixed + not reproducible here; Security GO is NOT declared (Codex re-review)
          assert set(r["security_remediation"].values()) == {"FIXED_PENDING_INDEPENDENT_REVIEW"}, r["security_remediation"]
          PY
          python -m strategy_agent.execution.acceptance --out-dir "$RUNNER_TEMP/executions/ci_${GITHUB_SHA::7}" --verify-archive
          git diff --exit-code -- registry governance configs schemas
      - uses: actions/upload-artifact@v4
        with:
          name: phase5b2-execution-acceptance-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/executions/*/*.json
            ${{ runner.temp }}/executions/*/run_info.txt
          retention-days: 30

  phase5b2-p0-2-independent:
    # Independent synthetic-only archive settlement check. No Core, no secrets, no real authorization.
    # Fail closed when research_request.json is missing or changed, including after evidence verification.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies (no Core)
        run: pip install -e '.[test]'
      - name: Independent P0-2 original archive-request path
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_phase5b2_independent_p0_2_gate.py \
            --junitxml "$RUNNER_TEMP/independent_p0_2.xml"
          git diff --exit-code -- registry governance configs schemas
      - name: Publish test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-p0-2-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/independent_p0_2.xml
          if-no-files-found: warn
          retention-days: 30

  phase5b3a-readiness:
    # Phase 5-B3-A: production READINESS only (no backtest, no market data, no Holdout, no authorization created or
    # consumed; real Runner DISABLED). Core b16179a is installed so the 5-B2 Layer B suites run as evidence.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MRC_SHA: b16179a7cc077c36046574769a32c367fa476cae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}" pyarrow
      - name: Governance / controlled-execution / readiness suites (junit)
        run: |
          rc=0
          pytest -q -p no:cacheprovider tests/test_phase5b1*.py tests/test_phase5b2_*.py tests/test_phase5b3a_readiness.py \
            --junitxml "$RUNNER_TEMP/b3a.xml" || rc=$?
          echo "TESTS_RC=$rc" >> "$GITHUB_ENV"
          test "$rc" = 0
      - name: Committed manifest / draft are the deterministic output
        run: |
          python -m strategy_agent.readiness.acceptance --emit-docs
          git diff --exit-code -- docs/phase5b3a
      - name: B3A-01..B3A-08 (CI is not cloud evidence => B3A-08 BLOCKED; no gate may FAIL)
        run: |
          python -m strategy_agent.readiness.acceptance --out-dir "$RUNNER_TEMP/readiness/ci" \
            --junit "$RUNNER_TEMP/b3a.xml" --tests-rc "$TESTS_RC" | tee "$RUNNER_TEMP/b3a_result.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "b3a_result.json")))
          print(r["verdict"]["verdict"], r["gates"])
          assert "FAIL" not in r["gates"].values(), r["gates"]
          assert r["gates"]["B3A-08"] == "BLOCKED"          # cloud reproducibility is evidenced only by Colab + Drive
          PY
          python -m strategy_agent.readiness.acceptance --verify-archive "$RUNNER_TEMP/readiness/ci"
          git diff --exit-code -- registry governance configs schemas specs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5b3a-readiness-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/b3a.xml
            ${{ runner.temp }}/readiness/ci
          if-no-files-found: warn
          retention-days: 30

  phase5b3b-real-execution:
    # Phase 5-B3-B: REAL_GATED controlled execution engineering (activation gate A01-A10). Isolated books, mock runner
    # and the existing runner on a Core-produced SYNTHETIC snapshot only; no real data, no authorization, Runner DISABLED.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MRC_SHA: b16179a7cc077c36046574769a32c367fa476cae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}" pyarrow
      - name: B3-B + B2 + B1 suites (junit; Layer B uses Core)
        run: |
          rc=0
          pytest -q -p no:cacheprovider tests/test_phase5b3b_*.py tests/test_phase5b2_*.py tests/test_phase5b1*.py \
            --junitxml "$RUNNER_TEMP/b3b.xml" || rc=$?
          echo "TESTS_RC=$rc" >> "$GITHUB_ENV"
          test "$rc" = 0
      - name: B3B-01..B3B-10 (CI is not cloud evidence => B3B-10 BLOCKED; B3B-01..09 must PASS)
        run: |
          python -m strategy_agent.execution.real_acceptance --out-dir "$RUNNER_TEMP/b3b/ci" \
            --junit "$RUNNER_TEMP/b3b.xml" --tests-rc "$TESTS_RC" | tee "$RUNNER_TEMP/b3b_result.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "b3b_result.json")))
          print(r["verdict"]["verdict"], r["gates"], r["layers"])
          assert all(r["gates"][f"B3B-0{i}"] == "PASS" for i in range(1, 10)), r["gates"]
          assert r["gates"]["B3B-10"] == "BLOCKED" and r["layers"]["real_execution"] == "NOT_PERFORMED"
          from strategy_agent.readiness.b3c import expected_eligible, formal_authorization_state
          st = formal_authorization_state()["state"]
          assert st in ("NOT_GRANTED", "GRANTED_UNUSED", "GRANTED_USED"), st      # only the ONE governed B3-C authorization
          assert r["layers"]["research_authorization"] == ("GRANTED" if expected_eligible() else "NOT_GRANTED")
          PY
          python -m strategy_agent.execution.real_acceptance --verify-archive "$RUNNER_TEMP/b3b/ci"
          git diff --exit-code -- registry governance configs specs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5b3b-real-execution-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/b3b.xml
            ${{ runner.temp }}/b3b/ci
          if-no-files-found: warn
          retention-days: 30

  phase5b3c-preparation:
    # Phase 5-B3-C PREPARATION only: authorization draft (docs/, never governance/), run-config derivation in memory,
    # non-consuming preflight. Every B3C gate must stay NOT_EXECUTED; no authorization, binding, budget or Runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MRC_SHA: b16179a7cc077c36046574769a32c367fa476cae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}" pyarrow
      - run: pytest -q -p no:cacheprovider tests/test_phase5b3c_preparation.py tests/test_phase5b3a_readiness.py tests/test_phase4a_research_only.py
      - name: Committed draft is the deterministic output
        run: |
          python -m strategy_agent.readiness.b3c emit-docs
          git diff --exit-code -- docs/phase5b3c
      - name: Preflight (B3C-01..10 NOT_EXECUTED; never a real-research PASS)
        run: |
          python -m strategy_agent.readiness.b3c preflight --out "$RUNNER_TEMP/b3c_preflight.json" > /dev/null
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "b3c_preflight.json")))
          assert {g["status"] for g in r["gates"].values()} == {"NOT_EXECUTED"}, r["gates"]
          assert r["real_research_pass"] is False
          st = r["authorization_state"]
          assert st in ("NOT_GRANTED", "GRANTED_UNUSED", "GRANTED_USED"), st
          assert r["real_execution"] == ("PERFORMED_ONCE" if st == "GRANTED_USED" else "NOT_PERFORMED")
          assert not r["preparation_problems"], r["preparation_problems"]
          from strategy_agent.readiness.b3c import governed_ledger_ok
          assert governed_ledger_ok()
          PY
          git diff --exit-code -- registry governance configs specs

  phase5b3c-execution:
    # Phase 5-B3-C execution path: run 1 (prepare) on the repository books (non-consuming) + the full prepare ->
    # execute flow on ISOLATED books with the existing runner + Core b16179a on a SYNTHETIC snapshot. The real run
    # happens only in the research lead's Colab session; CI never consumes the real authorization.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MRC_SHA: b16179a7cc077c36046574769a32c367fa476cae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@${MRC_SHA}" pyarrow
      - run: pytest -q -p no:cacheprovider tests/test_phase5b3c_execution*.py tests/test_phase5b3b_*.py tests/test_orchestrator_lifecycle.py
      - name: Committed completion is the deterministic build; repository books untouched
        run: |
          python -m strategy_agent.execution.b3c_run emit-completion
          git diff --exit-code -- specs registry governance configs
          python -c "from strategy_agent.readiness.b3c import governed_ledger_ok as g; assert g()"

  phase5c1-research-design:
    # Phase 5-C1: pre-registered research design only (no data, no execution, no authorization). Regime / drift
    # control units, the draft spec against the spec schema, and the closed-notebook pin invariants.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q -p no:cacheprovider tests/test_phase5c1_regimes.py tests/test_phase5c1_proposal.py tests/test_m3b_notebook.py
      - name: Draft spec 0.2.0 is schema- and semantics-valid; rules identical to the 0.1.1 baseline
        run: |
          python -m strategy_agent.spec.validate docs/phase5c1/strategy_spec_v0_2_0.draft.json
          python -m strategy_agent.execution.c1_proposal emit
          git diff --exit-code -- docs/phase5c1 registry governance configs specs

  phase5a3-integration:
    # Phase 5-A3: actual A2 export -> actual A1 orchestrator (SYNTHETIC_FIXTURE Route A + fixture archive replay).
    # No Core, no market data, no batch, no Holdout. Real archive replay runs only in Colab (notebook).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # schema is diffed against the 5d088c4 contract commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q tests/test_phase5a3_integration.py tests/test_orchestrator_lifecycle.py tests/test_orchestrator_request_contract.py tests/test_proposal_agent.py tests/test_proposal_contract.py
      - name: A3-01..A3-10 acceptance in a fresh process (expected SCOPED_GO without Colab/Drive)
        run: |
          python -m strategy_agent.phase5a acceptance --out-dir "$RUNNER_TEMP/integrations/ci_${GITHUB_SHA::7}" | tee "$RUNNER_TEMP/a3.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "a3.json")))
          assert set(r["gates"].values()) == {"PASS"}, r["gates"]
          assert r["verdict"]["verdict"] == "SCOPED_GO", r["verdict"]
          PY
          git diff --exit-code -- registry governance schemas
      - uses: actions/upload-artifact@v4
        with:
          name: phase5a3-integration-acceptance
          path: |
            ${{ runner.temp }}/integrations/*/*.json
            ${{ runner.temp }}/integrations/*/run_info.txt
          retention-days: 30

  phase5b1-approval:
    # Phase 5-B1: trusted approval evidence + governed authorization binding (isolated TEST_FIXTURE evidence,
    # SYNTHETIC_FIXTURE binding world, 18 threats). No token is given: the live part stays PENDING (fail closed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Phase 5-B1 tests (real exit code recorded; a failure fails the step)
        run: |
          set -o pipefail
          rc=0
          pytest -q tests/test_phase5b1_approval_binding.py tests/test_phase5b1_security_remediation.py \
            tests/test_orchestrator_lifecycle.py tests/test_phase5a3_integration.py | tee "$RUNNER_TEMP/b1_pytest.txt" || rc=$?
          echo "$rc" > "$RUNNER_TEMP/b1_rc"
          exit "$rc"
      - name: B1-01..B1-10 acceptance in a fresh process (expected SCOPED_GO without real evidence / Drive)
        run: |
          python - <<'PY'
          import json, os
          t = os.environ["RUNNER_TEMP"]
          rc = int(open(os.path.join(t, "b1_rc")).read().strip())
          tail = open(os.path.join(t, "b1_pytest.txt")).read().strip().splitlines()[-1]
          json.dump({"returncode": rc, "summary": tail, "where": "GitHub Actions"}, open(os.path.join(t, "b1_tests.json"), "w"))
          PY
          python docs/evidence/phase5b1_remediation/reproduce.py "$PWD" "$RUNNER_TEMP/b1_remediation.json"
          python -m strategy_agent.binding.acceptance --out-dir "$RUNNER_TEMP/approvals/ci_${GITHUB_SHA::7}" \
            --tests-json "$RUNNER_TEMP/b1_tests.json" --remediation-json "$RUNNER_TEMP/b1_remediation.json" \
            | tee "$RUNNER_TEMP/b1.json"
          python -m strategy_agent.binding.acceptance --out-dir "$RUNNER_TEMP/approvals/ci_${GITHUB_SHA::7}" --verify-archive
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "b1.json")))
          assert set(r["gates"].values()) == {"PASS"}, r["gates"]
          assert r["verdict"]["verdict"] == "SCOPED_GO", r["verdict"]
          PY
          git diff --exit-code -- registry governance schemas
      - uses: actions/upload-artifact@v4
        with:
          name: phase5b1-approval-acceptance
          path: |
            ${{ runner.temp }}/approvals/*/*.json
            ${{ runner.temp }}/approvals/*/run_info.txt
          retention-days: 30

  append-only:
    # Governed logs (registry/, governance/) may only grow relative to the PR base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m strategy_agent.governance.append_only_guard --base origin/${{ github.base_ref }}

  phase5c1-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,research]' "market-research-core @ git+https://github.com/hh4832/market-research-core@bc0592984a09d806ebb9ef78ce377db78b404f86"
      - run: pytest -q -p no:cacheprovider tests/test_phase5c1*.py tests/test_phase5b3c_execution.py tests/test_phase4a_research_only.py
      - run: git diff --exit-code -- governance registry configs specs docs/evidence
